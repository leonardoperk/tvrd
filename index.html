<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>PPL Tracker</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #c8f135;
    --accent-dim: rgba(200,241,53,0.12);
    --text: #f0f0f0;
    --text-muted: #666;
    --text-dim: #999;
    --red: #ff4444;
    --green: #4caf50;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  button, input { touch-action: manipulation; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* SCREENS */
  .screen { display: none; flex-direction: column; min-height: 100dvh; }
  .screen.active { display: flex; }

  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .header-title { font-size: 17px; font-weight: 700; flex: 1; letter-spacing: -0.3px; }
  .header-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .btn-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface2); border: none; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; cursor: pointer; flex-shrink: 0;
    transition: background 0.15s;
  }
  .btn-icon:active { background: var(--border); }

  /* SCROLL AREA */
  .scroll-area { flex: 1; overflow-y: auto; padding: 12px 16px 88px; }

  /* HOME SCREEN: cards fill full available height */
  #screen-home .scroll-area {
    display: flex; flex-direction: column;
    padding-bottom: 16px; overflow: hidden;
  }

  /* DAY CARDS */
  .day-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #screen-home .day-grid { flex: 1; grid-auto-rows: 1fr; }
  .day-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .day-card:active { background: var(--surface2); border-color: var(--accent); }

  /* card top: emoji + name */
  .card-top { display: flex; align-items: center; gap: 8px; }
  .day-dot {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent-dim); border: 1.5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .day-name { font-size: 13px; font-weight: 700; line-height: 1.2; }

  /* card analytics section */
  .card-analytics {
    flex: 1; display: flex; flex-direction: column; gap: 6px;
  }
  .card-date-row { font-size: 11px; color: var(--text-muted); }
  .card-vol-row { display: flex; align-items: baseline; gap: 3px; flex-wrap: wrap; }
  .card-vol { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
  .card-vol-unit { font-size: 11px; color: var(--text-muted); }
  .vol-trend {
    font-size: 11px; font-weight: 700; margin-left: 2px;
    padding: 1px 5px; border-radius: 4px;
  }
  .vol-trend.up { color: var(--accent); background: var(--accent-dim); }
  .vol-trend.down { color: var(--red); background: rgba(255,68,68,0.1); }
  .card-meta-row { font-size: 11px; color: var(--text-dim); }
  .card-weeks-row {
    display: flex; align-items: center; gap: 5px;
    margin-top: auto; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .week-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--border);
  }
  .week-dot.active { background: var(--accent); }
  .weeks-label { font-size: 10px; color: var(--text-muted); margin-left: 2px; }
  .card-no-history {
    flex: 1; display: flex; align-items: center;
    font-size: 12px; color: var(--text-muted);
  }
  .day-arrow { display: none; }
  .day-info { display: none; }
  .day-meta { display: none; }

  /* EXERCISE LIST IN WORKOUT */
  .exercise-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    overflow: hidden;
  }
  .exercise-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .exercise-name { font-size: 14px; font-weight: 700; flex: 1; }
  .exercise-target { font-size: 12px; color: var(--accent); font-weight: 600; }
  .last-session {
    padding: 6px 12px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
  }
  .last-session-icon { color: var(--text-muted); opacity: 0.6; }

  /* SET COLUMN HEADERS */
  .set-cols-header {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .set-col-label {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.8px; text-align: center;
  }
  .set-col-label.reps-col { flex: 0 0 112px; text-align: center; }
  .set-col-label.weight-col { flex: 1; text-align: center; }

  /* SET ROWS */
  .set-row {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.2s;
  }
  .set-row:last-child { border-bottom: none; }
  .set-row.done { background: rgba(200,241,53,0.04); }
  .set-label {
    font-size: 11px; color: var(--text-muted); font-weight: 700;
    width: 22px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* NUMBER INPUT WIDGET */
  .num-widget {
    display: flex; align-items: center;
    background: var(--surface2); border-radius: var(--radius-sm);
    border: 1px solid var(--border); overflow: hidden;
  }
  .num-widget.reps-widget { flex: 0 0 112px; }
  .num-widget.weight-widget { flex: 1; }
  .num-btn {
    width: 44px; height: 48px; border: none; background: transparent;
    color: var(--text-dim); font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: color 0.1s, background 0.1s;
    font-weight: 300;
  }
  .num-btn:active { background: var(--border); color: var(--accent); }
  .num-input {
    flex: 1; min-width: 0; text-align: center;
    background: transparent; border: none; outline: none;
    color: var(--text); font-size: 20px; font-weight: 700;
    font-family: inherit; padding: 0; height: 48px;
  }

  /* CHECK BUTTON */
  .set-check {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--border); background: transparent;
    color: var(--text-muted); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
  }
  .set-check.checked {
    background: var(--accent); border-color: var(--accent); color: #000;
  }
  .set-check:active { transform: scale(0.9); }

  /* BOTTOM BAR */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }
  .btn-primary {
    flex: 1; height: 48px; border-radius: var(--radius);
    background: var(--accent); border: none; color: #000;
    font-size: 16px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: -0.2px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-primary:active { opacity: 0.85; transform: scale(0.98); }
  .btn-secondary {
    height: 48px; padding: 0 16px; border-radius: var(--radius);
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-secondary:active { background: var(--border); }

  /* PLAN EDITOR */
  .plan-section { margin-bottom: 24px; }
  .plan-section-title {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; padding: 0 4px;
  }
  .plan-day-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px; overflow: hidden;
  }
  .plan-day-header {
    padding: 14px 16px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .plan-day-header.open { border-bottom-color: var(--border); }
  .plan-day-name {
    flex: 1; font-size: 15px; font-weight: 700;
  }
  .plan-day-toggle { color: var(--text-muted); font-size: 14px; transition: transform 0.2s; }
  .plan-day-toggle.open { transform: rotate(180deg); }
  .plan-day-body { display: none; padding: 12px 16px; }
  .plan-day-body.open { display: block; }

  .plan-exercise-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    touch-action: none;
  }
  .plan-exercise-row:last-child { border-bottom: none; }
  .drag-handle {
    width: 24px; display: flex; align-items: center; justify-content: center;
    color: var(--border); font-size: 18px; cursor: grab; flex-shrink: 0;
    letter-spacing: -2px;
  }
  .drag-ph {
    height: 44px; border-radius: var(--radius-sm);
    background: var(--accent-dim); border: 1px dashed var(--accent);
    margin: 2px 0;
  }
  .plan-exercise-row.dragging {
    opacity: 0.4;
  }
  .plan-ex-name { flex: 1; font-size: 14px; }
  .plan-ex-meta { font-size: 12px; color: var(--text-muted); }
  .plan-ex-delete {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,68,68,0.1); border: none; color: var(--red);
    font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .plan-ex-edit {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--surface2); border: none; color: var(--text-muted);
    font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  .add-exercise-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 0; cursor: pointer; color: var(--accent);
    font-size: 14px; font-weight: 600; background: none; border: none;
    font-family: inherit;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--border);
    width: 100%; max-width: 480px;
    padding: 20px 20px max(20px, env(safe-area-inset-bottom));
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } }
  .modal-handle {
    width: 36px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 0 auto 16px;
  }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .form-field { margin-bottom: 14px; }
  .form-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input {
    width: 100%; height: 48px; border-radius: var(--radius-sm);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 16px; padding: 0 14px;
    font-family: inherit; outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-field { flex: 1; }

  /* PR ANIMATIONS */
  @keyframes prRowFlash {
    0%   { background: transparent; }
    25%  { background: rgba(200,241,53,0.2); }
    100% { background: transparent; }
  }
  @keyframes prExGlow {
    0%   { box-shadow: none; border-color: var(--border); }
    30%  { box-shadow: 0 0 24px rgba(200,241,53,0.35); border-color: var(--accent); }
    100% { box-shadow: none; border-color: var(--border); }
  }
  @keyframes prBadgeIn {
    from { transform: scale(0) translateY(4px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes prBadgeFade { to { opacity: 0; transform: translateY(-8px); } }
  @keyframes sessionPRPulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.15); }
  }
  .pr-row-flash { animation: prRowFlash 0.8s ease; }
  .pr-ex-glow   { animation: prExGlow 1s ease; }
  .pr-badge {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: var(--accent); color: #000;
    font-size: 10px; font-weight: 800; border-radius: 4px; padding: 2px 7px;
    pointer-events: none; z-index: 10; white-space: nowrap;
    animation: prBadgeIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275),
               prBadgeFade 0.4s ease 2.2s forwards;
  }
  .finish-pr-badge {
    display: inline-block; background: var(--accent); color: #000;
    font-size: 13px; font-weight: 800; border-radius: 8px; padding: 4px 14px;
    margin-bottom: 12px;
    animation: sessionPRPulse 0.6s ease 0.3s 2;
  }

  /* WEEK DOT TOOLTIP */
  .week-dots-wrap { position: relative; display: inline-flex; align-items: center; gap: 4px; cursor: default; }
  .week-dots-wrap:hover .week-tooltip, .week-dots-wrap:active .week-tooltip { opacity: 1; pointer-events: auto; }
  .week-tooltip {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 11px; color: var(--text-dim);
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.15s; z-index: 20;
  }

  /* ANALYTICS SCREEN */
  .analytics-tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .analytics-tab {
    flex-shrink: 0; height: 42px; padding: 0 16px;
    display: flex; align-items: center; font-size: 13px; font-weight: 600;
    color: var(--text-muted); border-bottom: 2px solid transparent; cursor: pointer;
    white-space: nowrap; transition: all 0.15s;
  }
  .analytics-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .analytics-panel { display: none; }
  .analytics-panel.active { display: block; }

  .pr-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pr-table th { text-align: left; color: var(--text-muted); font-size: 11px; font-weight: 600; padding: 6px 0 8px; text-transform: uppercase; letter-spacing: 0.4px; }
  .pr-table td { padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.05); vertical-align: top; }
  .pr-ex-name-cell { font-weight: 600; padding-right: 8px; }
  .pr-val { font-weight: 700; color: var(--text); }
  .pr-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-card {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; text-align: center;
  }
  .stat-card-num { font-size: 24px; font-weight: 800; color: var(--accent); }
  .stat-card-label { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  .heatmap { display: flex; gap: 3px; flex-wrap: wrap; }
  .heatmap-week { display: flex; flex-direction: column; gap: 3px; }
  .heatmap-day { width: 14px; height: 14px; border-radius: 3px; background: var(--surface2); }
  .heatmap-day.active { background: var(--accent); }
  .heatmap-day.dim { background: rgba(200,241,53,0.35); }

  .prog-select {
    width: 100%; height: 44px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 15px; border-radius: var(--radius-sm);
    padding: 0 12px; font-family: inherit; margin-bottom: 16px; outline: none;
  }
  .chart-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  .chart-wrap { margin-bottom: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 12px 4px; }
  .chart-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 10px 20px;
    font-size: 14px; font-weight: 500;
    opacity: 0; transition: all 0.25s; z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* FINISH SCREEN */
  .finish-summary {
    text-align: center; padding: 40px 20px;
  }
  .finish-icon { font-size: 56px; margin-bottom: 16px; }
  .finish-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
  .finish-sub { font-size: 15px; color: var(--text-muted); margin-bottom: 32px; }
  .finish-stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 32px;
  }
  .finish-stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .finish-stat-num { font-size: 28px; font-weight: 800; color: var(--accent); }
  .finish-stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* HISTORY VIEW */
  .history-session {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
  }
  .history-session-header {
    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }
  .history-session-date { font-size: 14px; font-weight: 600; }
  .history-session-meta { font-size: 12px; color: var(--text-muted); }
  .history-session-body { display: none; padding: 0 16px 14px; border-top: 1px solid var(--border); }
  .history-session-body.open { display: block; }
  .history-ex-row { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .history-ex-row:last-child { border-bottom: none; }
  .history-ex-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .history-set-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .history-set-pill {
    background: var(--surface2); border-radius: 6px;
    padding: 3px 8px; font-size: 11px; color: var(--text-dim);
  }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state-text { font-size: 15px; }

  /* DRAFT BANNER */
  .draft-banner {
    margin: 12px 16px 0;
    background: var(--surface2); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .draft-banner-text { flex: 1; font-size: 13px; font-weight: 600; }
  .draft-banner-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .draft-btn-resume {
    background: var(--accent); color: #000; border: none;
    border-radius: var(--radius-sm); padding: 8px 14px;
    font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }
  .draft-btn-discard {
    background: none; border: none; color: var(--text-muted);
    font-size: 18px; cursor: pointer; padding: 4px; flex-shrink: 0;
  }

  /* PREVIEW SCREEN */
  .preview-ex-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
  }
  .preview-ex-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .preview-ex-meta { font-size: 12px; color: var(--text-muted); }
  .preview-ex-last { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  /* PROGRESS BARS */
  .exercise-progress {
    height: 3px; background: var(--border); border-radius: 2px; margin: 0 16px 2px;
  }
  .exercise-progress-fill {
    height: 100%; background: var(--accent); border-radius: 2px;
    transition: width 0.3s ease;
  }

  /* NAV TABS */
  .nav-tabs {
    display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 20px;
  }

</style>
</head>
<body>

<!-- HOME SCREEN -->
<div class="screen active" id="screen-home">

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────

const DB_KEY = 'tvrd_db';         // stable forever — never change this key
const CURRENT_VERSION = 1;        // bump when schema changes, add migration below

function migrateDB(db) {
  // Each block runs only once per user, in order.
  // Add new blocks here when the schema changes — never edit existing ones.

  // if (db.version < 2) {
  //   db.plan.days.forEach(day =>
  //     day.exercises.forEach(ex => ex.someNewField ??= defaultValue)
  //   );
  //   db.version = 2;
  // }

  return db;
}

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const db = JSON.parse(raw);
      if (db.version < CURRENT_VERSION) {
        const migrated = migrateDB(db);
        localStorage.setItem(DB_KEY, JSON.stringify(migrated));
        return migrated;
      }
      return db;
    }
  } catch(e) {}
  return getDefaultDB();
}

function saveDB() {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function getDefaultDB() {
  return {
    version: CURRENT_VERSION,
    plan: {
      id: Date.now(),
      days: [
        {
          id: 'd1', name: 'Brust & Arme', emoji: '💪',
          exercises: [
            { id: 'e1', name: 'Seil-Crunch', sets: 3, targetReps: '12-15', weightStep: 5 },
            { id: 'e2', name: 'Trunk Swing (stand)', sets: 3, targetReps: '12-15', weightStep: 2.5 },

            { id: 'e4', name: 'BB Curl', sets: 3, targetReps: '10-12', weightStep: 2.5 },
            { id: 'e5', name: 'Incline Press', sets: 3, targetReps: '10-12', weightStep: 2.5 },
            { id: 'e6', name: 'Seated Curl', sets: 3, targetReps: '12-15', weightStep: 2.5 },
            { id: 'e7', name: 'Cable Pushdown', sets: 3, targetReps: '12-15', weightStep: 2.5 },
            { id: 'e8', name: 'Liegestütze', sets: 3, targetReps: '8-12', weightStep: 0 },
          ]
        },
        {
          id: 'd2', name: 'Beine', emoji: '🦵',
          exercises: [
            { id: 'e9',  name: 'Sissy-Squat', sets: 3, targetReps: '12-15', weightStep: 2.5 },
            { id: 'e10', name: 'Nordic Curl', sets: 3, targetReps: '10', weightStep: 0 },
            { id: 'e11', name: 'Reverse Hyper', sets: 3, targetReps: '10', weightStep: 5 },
            { id: 'e12', name: 'Front Squat', sets: 3, targetReps: '12-15', weightStep: 2.5 },
            { id: 'e13', name: 'Walking Lunges', sets: 3, targetReps: '12-15', weightStep: 2.5 },
            { id: 'e14', name: 'Wadl Hack', sets: 3, targetReps: 'all out', weightStep: 5 },
          ]
        },
        {
          id: 'd3', name: 'Schulter & Arme', emoji: '🏋️',
          exercises: [
            { id: 'e15', name: 'Trunk Swing hinged', sets: 3, targetReps: '12-15', weightStep: 2.5 },
            { id: 'e16', name: 'Ball Crunch', sets: 3, targetReps: '12-15', weightStep: 0 },
            { id: 'e17', name: 'Standing Side Raise', sets: 3, targetReps: '15-20', weightStep: 1.25 },
            { id: 'e18', name: 'Cable Pushdown', sets: 3, targetReps: '15-20', weightStep: 2.5 },
            { id: 'e19', name: 'Front Raise', sets: 3, targetReps: '10-12', weightStep: 2.5 },
            { id: 'e20', name: 'Bar Overhead Push', sets: 3, targetReps: '12-15', weightStep: 5 },
            { id: 'e21', name: 'Shoulder Press', sets: 3, targetReps: '8-10', weightStep: 2.5 },
            { id: 'e22', name: 'Single Arm Pushdown', sets: 3, targetReps: '10-12', weightStep: 2.5 },
          ]
        },
        {
          id: 'd4', name: 'Rücken', emoji: '🔙',
          exercises: [
            { id: 'e23', name: 'Reverse Hyper', sets: 3, targetReps: '15-20', weightStep: 5 },
            { id: 'e24', name: 'Kettle Swing', sets: 3, targetReps: '15-20', weightStep: 4 },
            { id: 'e25', name: 'Pulldown Front', sets: 3, targetReps: '12-15', weightStep: 5 },
            { id: 'e26', name: 'Cable Row', sets: 3, targetReps: '15-20', weightStep: 5 },
            { id: 'e27', name: 'Klimmzüge', sets: 3, targetReps: '8-10', weightStep: 0 },
            { id: 'e28', name: 'Smith Row', sets: 3, targetReps: '12-15', weightStep: 5 },
            { id: 'e29', name: 'Lower Back Row', sets: 3, targetReps: '12-15', weightStep: 5 },
          ]
        },
      ]
    },
    history: [], // { id, planId, dayId, dayName, date, exercises: [{exId, name, sets:[{reps,weight}]}] }
    draftWorkout: null
  };
}

let db = loadDB();

// ─── ROUTING ──────────────────────────────────────────────────────────────────

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'screen-home') renderHome();
  if (id === 'screen-plan') renderPlan();
  if (id === 'screen-history') renderHistory('all');
  if (id === 'screen-analytics') renderAnalytics('verlauf');
}

// ─── HOME ─────────────────────────────────────────────────────────────────────

function renderHome() {
  const dateEl = document.getElementById('home-date');
  dateEl.textContent = new Date().toLocaleDateString('de-AT', { weekday: 'long', day: 'numeric', month: 'long' });

  // Draft banner
  const bannerEl = document.getElementById('draft-banner');
  const draft = db.draftWorkout;
  if (draft) {
    const elapsed = draft.timerSeconds + Math.floor((Date.now() - draft.savedAt) / 1000);
    const m = Math.floor(elapsed / 60);
    bannerEl.style.display = '';
    bannerEl.innerHTML = `
      <div class="draft-banner">
        <div style="flex:1">
          <div class="draft-banner-text">⚡ ${draft.workoutState.dayName}</div>
          <div class="draft-banner-sub">Unterbrochen vor ${m < 1 ? 'weniger als 1 min' : m + ' min'}</div>
        </div>
        <button class="draft-btn-resume" onclick="resumeWorkout()">Fortsetzen</button>
        <button class="draft-btn-discard" onclick="discardDraft()" title="Verwerfen">✕</button>
      </div>
    `;
  } else {
    bannerEl.style.display = 'none';
    bannerEl.innerHTML = '';
  }

  const grid = document.getElementById('day-grid');
  const days = db.plan.days;

  if (!days.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Noch kein Plan. Tippe ⚙️ um einen Plan zu erstellen.</div></div>`;
    return;
  }

  grid.innerHTML = days.map(day => {
    const sessions = db.history.filter(h => h.dayId === day.id).sort((a, b) => b.date - a.date);
    const calcVol = s => s.exercises.reduce((a, ex) => a + ex.sets.reduce((b, st) => b + st.reps * st.weight, 0), 0);

    let analyticsHTML;
    if (!sessions.length) {
      analyticsHTML = `<div class="card-no-history">Noch kein Training</div>`;
    } else {
      const last = sessions[0];
      const prev = sessions[1] || null;
      const lastVol = calcVol(last);
      const prevVol = prev ? calcVol(prev) : null;
      const trend = (prevVol && prevVol > 0) ? Math.round((lastVol - prevVol) / prevVol * 100) : null;
      const lastSets = last.exercises.reduce((a, ex) => a + ex.sets.length, 0);
      const lastMin = Math.floor((last.duration || 0) / 60);

      const trendHTML = trend !== null
        ? `<span class="vol-trend ${trend >= 0 ? 'up' : 'down'}">${trend >= 0 ? '↑' : '↓'}${Math.abs(trend)}%</span>`
        : '';

      const now = Date.now();
      const weekDots = [0,1,2,3].map(w => {
        const hit = sessions.some(s => {
          const ago = (now - s.date) / 86400000;
          return ago >= w * 7 && ago < (w + 1) * 7;
        });
        return `<div class="week-dot ${hit ? 'active' : ''}"></div>`;
      }).join('');

      analyticsHTML = `
        <div class="card-date-row">${formatDate(last.date)}${lastMin ? ` · ${lastMin} min` : ''}</div>
        <div class="card-vol-row">
          <span class="card-vol">${lastVol > 0 ? Math.round(lastVol).toLocaleString('de') : lastSets}</span>
          <span class="card-vol-unit">${lastVol > 0 ? 'kg' : 'Sets'}</span>
          ${trendHTML}
        </div>
        <div class="card-meta-row">${lastSets} Sets · ${day.exercises.length} Übungen</div>
        <div class="card-weeks-row">
          <div class="week-dots-wrap">
            ${weekDots}
            <div class="week-tooltip">Trainings in den letzten 4 Wochen</div>
          </div>
        </div>
      `;
    }

    return `
      <div class="day-card" onclick="previewDay('${day.id}')">
        <div class="card-top">
          <div class="day-dot">${day.emoji || '💪'}</div>
          <div class="day-name">${day.name}</div>
        </div>
        <div class="card-analytics">${analyticsHTML}</div>
      </div>
    `;
  }).join('');
}

function getLastSession(dayId) {
  const sessions = db.history.filter(h => h.dayId === dayId);
  if (!sessions.length) return null;
  return sessions.sort((a, b) => b.date - a.date)[0];
}

function formatDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return 'Heute';
  if (diff === 1) return 'Gestern';
  if (diff < 7) return `vor ${diff} Tagen`;
  return d.toLocaleDateString('de-AT', { day: 'numeric', month: 'short' });
}

// ─── WORKOUT ──────────────────────────────────────────────────────────────────

let workoutState = null;
let timerInterval = null;
let timerSeconds = 0;
let pendingDayId = null;

function previewDay(dayId) {
  const day = db.plan.days.find(d => d.id === dayId);
  if (!day) return;
  pendingDayId = dayId;

  document.getElementById('preview-title').textContent = day.name;

  const lastSession = getLastSession(dayId);
  const body = document.getElementById('preview-body');
  body.innerHTML = day.exercises.map(ex => {
    const lastEx = lastSession && lastSession.exercises.find(e => e.exId === ex.id);
    const lastLine = lastEx
      ? `🕐 ${lastEx.sets.map(s => `${s.reps}×${s.weight}kg`).join(' · ')}`
      : '🕐 Erstes Mal';
    return `
      <div class="preview-ex-item">
        <div class="preview-ex-name">${ex.name}</div>
        <div class="preview-ex-meta">${ex.sets} Sets · ${ex.targetReps} Reps</div>
        <div class="preview-ex-last">${lastLine}</div>
      </div>
    `;
  }).join('');

  showScreen('screen-day-preview');
}

function startWorkout() {
  const dayId = pendingDayId;
  const day = db.plan.days.find(d => d.id === dayId);
  if (!day) return;

  // Build workout state
  const lastSession = getLastSession(dayId);

  workoutState = {
    dayId: dayId,
    dayName: day.name,
    startTime: Date.now(),
    exercises: day.exercises.map(ex => {
      // Find last values for this exercise
      let lastSets = [];
      if (lastSession) {
        const lastEx = lastSession.exercises.find(e => e.exId === ex.id);
        if (lastEx) lastSets = lastEx.sets;
      }
      return {
        exId: ex.id,
        name: ex.name,
        targetReps: ex.targetReps,
        weightStep: ex.weightStep || 2.5,
        sets: Array.from({ length: ex.sets }, (_, i) => {
          const prev = lastSets[i];
          return {
            reps: prev ? prev.reps : '',
            weight: prev ? prev.weight : '',
            done: false
          };
        }),
        lastSets: lastSets
      };
    })
  };

  prShownForEx = new Set();
  renderWorkout();
  showScreen('screen-workout');
  startTimer();
}

function saveWorkoutDraft() {
  db.draftWorkout = {
    workoutState: JSON.parse(JSON.stringify(workoutState)),
    timerSeconds: timerSeconds,
    savedAt: Date.now()
  };
  saveDB();
}

function resumeWorkout() {
  const draft = db.draftWorkout;
  if (!draft) return;
  workoutState = draft.workoutState;
  const totalElapsed = draft.timerSeconds + Math.floor((Date.now() - draft.savedAt) / 1000);
  workoutState.startTime = Date.now() - totalElapsed * 1000;
  prShownForEx = new Set();
  renderWorkout();
  showScreen('screen-workout');
  startTimer();
}

function discardDraft() {
  db.draftWorkout = null;
  saveDB();
  renderHome();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerSeconds = Math.floor((Date.now() - workoutState.startTime) / 1000);
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    document.getElementById('workout-timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function renderWorkout() {
  if (!workoutState) return;
  document.getElementById('workout-title').textContent = workoutState.dayName;
  updateWorkoutProgress();

  const body = document.getElementById('workout-body');
  body.innerHTML = workoutState.exercises.map((ex, ei) => {
    const doneSets = ex.sets.filter(s => s.done).length;
    const progress = ex.sets.length ? (doneSets / ex.sets.length) * 100 : 0;

    const lastLine = ex.lastSets.length
      ? `🕐 Letztes Mal: ${ex.lastSets.map(s => `${s.reps}×${s.weight}kg`).join(' · ')}`
      : '🕐 Erstes Mal';

    const setsHTML = ex.sets.map((set, si) => {
      const prevSet = ex.lastSets[si];
      return `
        <div class="set-row ${set.done ? 'done' : ''}" id="set-${ei}-${si}">
          <div class="set-label">S${si+1}</div>
          <div class="num-widget reps-widget">
            <button class="num-btn" onclick="adjustVal(${ei},${si},'reps',-1)">−</button>
            <input class="num-input" type="number" inputmode="numeric"
              value="${set.reps}"
              placeholder="${ex.targetReps.split('-')[0]}"
              onchange="setVal(${ei},${si},'reps',this.value)"
              oninput="setVal(${ei},${si},'reps',this.value)">
            <button class="num-btn" onclick="adjustVal(${ei},${si},'reps',1)">+</button>
          </div>
          <div class="num-widget weight-widget">
            <button class="num-btn" onclick="adjustVal(${ei},${si},'weight',${-(ex.weightStep || 2.5)})">−</button>
            <input class="num-input" type="number" inputmode="decimal"
              value="${set.weight}"
              placeholder="${prevSet ? prevSet.weight : '0'}"
              onchange="setVal(${ei},${si},'weight',this.value)"
              oninput="setVal(${ei},${si},'weight',this.value)">
            <button class="num-btn" onclick="adjustVal(${ei},${si},'weight',${ex.weightStep || 2.5})">+</button>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="exercise-block">
        <div class="exercise-header">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-target">${ex.targetReps} reps</div>
        </div>
        <div class="exercise-progress"><div class="exercise-progress-fill" id="prog-${ei}" style="width:${progress}%"></div></div>
        <div class="last-session">${lastLine}</div>
        <div class="set-cols-header">
          <div class="set-label"></div>
          <div class="set-col-label reps-col">reps</div>
          <div class="set-col-label weight-col">kg</div>
        </div>
        ${setsHTML}
      </div>
    `;
  }).join('');
}

function updateWorkoutProgress() {
  if (!workoutState) return;
  const total = workoutState.exercises.reduce((a, ex) => a + ex.sets.length, 0);
  const done = workoutState.exercises.reduce((a, ex) => a + ex.sets.filter(s => s.done).length, 0);
  document.getElementById('workout-progress-text').textContent = `${done} / ${total} Sets`;
}

function isSetCommitted(set) {
  return (set.reps !== '' && parseFloat(set.reps) > 0) ||
         (set.weight !== '' && parseFloat(set.weight) > 0);
}

function adjustVal(ei, si, field, delta) {
  const set = workoutState.exercises[ei].sets[si];
  const current = parseFloat(set[field]) || 0;
  const newVal = Math.max(0, +(current + delta).toFixed(4));
  set[field] = newVal;
  const row = document.getElementById(`set-${ei}-${si}`);
  const selector = field === 'reps' ? '.reps-widget .num-input' : '.weight-widget .num-input';
  row.querySelector(selector).value = newVal;
  onValChangedWithPR(ei, si);
}

function setVal(ei, si, field, val) {
  workoutState.exercises[ei].sets[si][field] = val === '' ? '' : parseFloat(val) || 0;
  onValChangedWithPR(ei, si);
}

function onValChanged(ei, si) {
  const set = workoutState.exercises[ei].sets[si];
  set.done = isSetCommitted(set);

  const row = document.getElementById(`set-${ei}-${si}`);
  row.classList.toggle('done', set.done);

  const ex = workoutState.exercises[ei];
  const doneSets = ex.sets.filter(s => s.done).length;
  const progFill = document.getElementById(`prog-${ei}`);
  if (progFill) progFill.style.width = `${(doneSets / ex.sets.length) * 100}%`;

  updateWorkoutProgress();
  saveWorkoutDraft();
}

function confirmExitWorkout() {
  const doneSets = workoutState.exercises.reduce((a, ex) => a + ex.sets.filter(isSetCommitted).length, 0);
  if (doneSets === 0) {
    exitWorkout();
    return;
  }
  showConfirm(
    'Training abbrechen?',
    'Der aktuelle Fortschritt geht verloren.',
    exitWorkout
  );
}

function exitWorkout() {
  clearInterval(timerInterval);
  workoutState = null;
  db.draftWorkout = null;
  saveDB();
  closeModal('modal-confirm');
  showScreen('screen-home');
}

function finishWorkout() {
  if (!workoutState) return;
  clearInterval(timerInterval);
  db.draftWorkout = null;

  // Save to history
  const session = {
    id: Date.now().toString(),
    planId: db.plan.id,
    dayId: workoutState.dayId,
    dayName: workoutState.dayName,
    date: Date.now(),
    duration: timerSeconds,
    exercises: workoutState.exercises.map(ex => ({
      exId: ex.exId,
      name: ex.name,
      sets: ex.sets.filter(isSetCommitted).map(s => ({ reps: +s.reps || 0, weight: +s.weight || 0 }))
    })).filter(ex => ex.sets.length > 0)
  };

  db.history.unshift(session);
  saveDB();

  // Show finish screen
  const totalSets = session.exercises.reduce((a, ex) => a + ex.sets.length, 0);
  const totalVol = session.exercises.reduce((a, ex) => a + ex.sets.reduce((b, s) => b + s.reps * s.weight, 0), 0);
  const min = Math.floor(timerSeconds / 60);

  const isSessionPR = checkSessionPR(totalVol);
  document.getElementById('finish-icon').textContent = isSessionPR ? '🏆' : '🏋️';
  document.getElementById('finish-pr-badge').innerHTML = isSessionPR
    ? '<div class="finish-pr-badge">⚡ Neuer Session-PR!</div>' : '';
  document.getElementById('finish-sub').textContent = workoutState.dayName + ' · ' + new Date().toLocaleDateString('de-AT', { day: 'numeric', month: 'long' });
  document.getElementById('finish-stats').innerHTML = `
    <div class="finish-stat"><div class="finish-stat-num">${totalSets}</div><div class="finish-stat-label">Sets</div></div>
    <div class="finish-stat"><div class="finish-stat-num">${min}m</div><div class="finish-stat-label">Dauer</div></div>
    <div class="finish-stat"><div class="finish-stat-num">${session.exercises.length}</div><div class="finish-stat-label">Übungen</div></div>
    <div class="finish-stat"><div class="finish-stat-num">${Math.round(totalVol).toLocaleString('de')}</div><div class="finish-stat-label">kg Volumen</div></div>
  `;

  workoutState = null;
  showScreen('screen-finish');
}

// ─── DRAG & DROP ──────────────────────────────────────────────────────────────

let drag = null;

function onExDragStart(e, dayId, exIdx) {
  e.preventDefault();
  const row = document.getElementById(`pex-${dayId}-${exIdx}`);
  const rect = row.getBoundingClientRect();
  const touch = e.touches[0];

  const ph = document.createElement('div');
  ph.className = 'drag-ph';
  ph.style.height = rect.height + 'px';
  row.parentNode.insertBefore(ph, row);

  row.classList.add('dragging');
  row.style.cssText = `position:fixed;left:${rect.left}px;width:${rect.width}px;top:${rect.top}px;z-index:999;background:var(--surface2);border-radius:var(--radius-sm);padding:8px;box-shadow:0 8px 24px rgba(0,0,0,0.5);`;

  drag = { dayId, exIdx, row, ph, offsetY: touch.clientY - rect.top };

  document.addEventListener('touchmove', onExDragMove, { passive: false });
  document.addEventListener('touchend', onExDragEnd, { once: true });
}

function onExDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  const touch = e.touches[0];
  drag.row.style.top = (touch.clientY - drag.offsetY) + 'px';

  drag.row.style.display = 'none';
  const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
  drag.row.style.display = '';
  const rowUnder = elUnder?.closest('[data-ex-row]');
  if (rowUnder) {
    const rect = rowUnder.getBoundingClientRect();
    if (touch.clientY < rect.top + rect.height / 2) {
      rowUnder.parentNode.insertBefore(drag.ph, rowUnder);
    } else {
      rowUnder.parentNode.insertBefore(drag.ph, rowUnder.nextSibling);
    }
  }
}

function onExDragEnd() {
  if (!drag) return;
  document.removeEventListener('touchmove', onExDragMove);

  const { dayId, exIdx, row, ph } = drag;
  drag = null;

  const container = ph.parentNode;
  const children = [...container.children];
  const phIdx = children.indexOf(ph);
  const newIdx = children.slice(0, phIdx).filter(el => el.hasAttribute('data-ex-row')).length;

  ph.remove();
  row.style.cssText = '';
  row.classList.remove('dragging');

  if (newIdx !== exIdx) {
    const day = db.plan.days.find(d => d.id === dayId);
    const [moved] = day.exercises.splice(exIdx, 1);
    day.exercises.splice(newIdx, 0, moved);
    saveDB();
  }
  renderPlan(dayId);
}

function renderPlan(expandDayId) {
  const body = document.getElementById('plan-body');

  if (!days.length) {
    body.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Noch keine Trainingstage. Tippe + oben rechts.</div></div>`;
    return;

    const exHTML = day.exercises.map((ex, ei) => `
      <div class="plan-exercise-row" id="pex-${day.id}-${ei}" data-ex-row data-ex-idx="${ei}">
        <div class="drag-handle" ontouchstart="onExDragStart(event,'${day.id}',${ei})">⠿</div>
        <div class="plan-ex-name">${ex.name}</div>
        <div class="plan-ex-meta">${ex.sets}×${ex.targetReps}</div>
        <button class="plan-ex-edit" onclick="showEditExerciseModal('${day.id}', ${ei})">✏️</button>

    return `
      <div class="plan-day-block">
        <div class="plan-day-header" onclick="togglePlanDay('pd-${day.id}')">

          <div class="plan-day-toggle" id="pdt-${day.id}">▼</div>

// ─── PR SYSTEM ────────────────────────────────────────────────────────────────

let prShownForEx = new Set();
let prCheckTimers = {};

function getExBests(exId) {
  let bestWeight = 0, bestSetVol = 0, bestSessionVol = 0;
  db.history.forEach(session => {
    const ex = session.exercises.find(e => e.exId === exId);
    if (!ex) return;
    let sessionVol = 0;
    ex.sets.forEach(s => {
      bestWeight = Math.max(bestWeight, +s.weight || 0);
      bestSetVol = Math.max(bestSetVol, (+s.reps || 0) * (+s.weight || 0));
      sessionVol += (+s.reps || 0) * (+s.weight || 0);
    });
    bestSessionVol = Math.max(bestSessionVol, sessionVol);
  });
  return { bestWeight, bestSetVol, bestSessionVol };
}

function checkSetAndExPR(ei, si) {
  const ex = workoutState.exercises[ei];
  const set = ex.sets[si];
  const reps = +set.reps || 0;
  const weight = +set.weight || 0;
  if (!reps && !weight) return;

  const bests = getExBests(ex.exId);
  const setVol = reps * weight;
  const isWeightPR = weight > 0 && weight > bests.bestWeight;
  const isVolPR = setVol > 0 && setVol > bests.bestSetVol;

  if (isWeightPR || isVolPR) {
    const row = document.getElementById(`set-${ei}-${si}`);
    if (row) {
      row.querySelectorAll('.pr-badge').forEach(b => b.remove());
      row.classList.remove('pr-row-flash');
      void row.offsetWidth;
      row.classList.add('pr-row-flash');
      row.style.position = 'relative';
      const badge = document.createElement('div');
      badge.className = 'pr-badge';
      badge.textContent = isWeightPR ? '⚡ Gewicht PR' : '⚡ Volumen PR';
      row.appendChild(badge);
      setTimeout(() => badge.remove(), 2700);
    }
  }

  // Exercise PR: current session total vs. all-time session best for this exercise
  const sessionExVol = ex.sets.reduce((a, s) => a + (+s.reps||0)*(+s.weight||0), 0);
  if (sessionExVol > bests.bestSessionVol && sessionExVol > 0 && !prShownForEx.has(ei)) {
    prShownForEx.add(ei);
    const block = document.getElementById(`prog-${ei}`)?.closest('.exercise-block');
    if (block) {
      block.classList.remove('pr-ex-glow');
      void block.offsetWidth;
      block.classList.add('pr-ex-glow');
      const exBadge = document.createElement('div');
      exBadge.className = 'pr-badge';
      exBadge.style.cssText = 'position:absolute;right:12px;top:12px;';
      exBadge.textContent = '🏆 Übungs-PR';
      block.style.position = 'relative';
      block.appendChild(exBadge);
      setTimeout(() => exBadge.remove(), 3000);
    }
  }
}

function onValChangedWithPR(ei, si) {
  onValChanged(ei, si);
  clearTimeout(prCheckTimers[`${ei}-${si}`]);
  prCheckTimers[`${ei}-${si}`] = setTimeout(() => checkSetAndExPR(ei, si), 600);
}

function checkSessionPR(totalVol) {
  if (!db.history.length || totalVol <= 0) return false;
  const prevBest = Math.max(...db.history.slice(1).map(s =>
    s.exercises.reduce((a, ex) => a + ex.sets.reduce((b, st) => b + (+st.reps||0)*(+st.weight||0), 0), 0)
  ), 0);
  return totalVol > prevBest;
}

function renderVerlaufHTML() {
  const sessions = db.history;
  if (!sessions.length) return `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">Noch keine Sessions.</div></div>`;
  return sessions.map(session => {
    const d = new Date(session.date);
    const dateStr = d.toLocaleDateString('de-AT', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    const min = Math.floor((session.duration || 0) / 60);
    const totalSets = session.exercises.reduce((a, ex) => a + ex.sets.length, 0);
    const exHTML = session.exercises.map(ex => `
      <div class="history-ex-row">
        <div class="history-ex-name">${ex.name}</div>
        <div class="history-set-pills">${ex.sets.map((s,i) => `<span class="history-set-pill">S${i+1}: ${s.reps}r · ${s.weight}kg</span>`).join('')}</div>
      </div>`).join('');
    return `
      <div class="history-session">
        <div class="history-session-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <div><div class="history-session-date">${session.dayName}</div><div class="history-session-meta">${dateStr} · ${totalSets} Sets${min ? ' · '+min+'min' : ''}</div></div>
          <div style="color:var(--text-muted);font-size:18px">›</div>
        </div>
        <div class="history-session-body">${exHTML}</div>
      </div>`;
  }).join('');
}

function renderPRBoardHTML() {
  const allExIds = new Map();
  db.history.forEach(s => s.exercises.forEach(ex => {
    if (!allExIds.has(ex.exId)) allExIds.set(ex.exId, ex.name);
  }));
  if (!allExIds.size) return `<div class="empty-state"><div class="empty-state-icon">🏆</div><div class="empty-state-text">Noch keine PRs — training starten!</div></div>`;

  const rows = [...allExIds.entries()].map(([exId, name]) => {
    let bestWeight = 0, bestWeightDate = null;
    let bestSetVol = 0, bestSetVolDate = null;
    db.history.forEach(s => {
      const ex = s.exercises.find(e => e.exId === exId);
      if (!ex) return;
      ex.sets.forEach(st => {
        if ((+st.weight||0) > bestWeight) { bestWeight = +st.weight; bestWeightDate = s.date; }
        const sv = (+st.reps||0)*(+st.weight||0);
        if (sv > bestSetVol) { bestSetVol = sv; bestSetVolDate = s.date; }
      });
    });
    const fmt = ts => new Date(ts).toLocaleDateString('de-AT', { day:'numeric', month:'short' });
    return `<tr>
      <td class="pr-ex-name-cell">${name}</td>
      <td><div class="pr-val">${bestWeight > 0 ? bestWeight+'kg' : '—'}</div>${bestWeightDate ? `<div class="pr-date">${fmt(bestWeightDate)}</div>` : ''}</td>
      <td><div class="pr-val">${bestSetVol > 0 ? Math.round(bestSetVol)+'kg' : '—'}</div>${bestSetVolDate ? `<div class="pr-date">${fmt(bestSetVolDate)}</div>` : ''}</td>
    </tr>`;
  }).join('');

  return `<div style="padding:16px">
    <table class="pr-table">
      <thead><tr><th>Übung</th><th>Max Gewicht</th><th>Set Volumen</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderProgressionHTML() {
  const allExIds = new Map();
  db.history.forEach(s => s.exercises.forEach(ex => {
    if (!allExIds.has(ex.exId)) allExIds.set(ex.exId, ex.name);
  }));
  const options = [...allExIds.entries()].map(([id, name]) => `<option value="${id}">${name}</option>`).join('');
  return `<div style="padding:16px">
    <select class="prog-select" id="prog-ex-select" onchange="renderProgCharts(this.value)">
      <option value="">— Übung wählen —</option>${options}
    </select>
    <div id="prog-charts"></div>
  </div>`;
}

function setupProgSelect() {
  const sel = document.getElementById('prog-ex-select');
  if (sel && sel.options.length > 1) {
    sel.selectedIndex = 1;
    renderProgCharts(sel.value);
  }
}

function renderProgCharts(exId) {
  const container = document.getElementById('prog-charts');
  if (!container || !exId) return;
  const data = db.history
    .filter(s => s.exercises.some(e => e.exId === exId))
    .sort((a, b) => a.date - b.date)
    .map(s => {
      const ex = s.exercises.find(e => e.exId === exId);
      const maxW = Math.max(...ex.sets.map(st => +st.weight || 0));
      const vol = ex.sets.reduce((a, st) => a + (+st.reps||0)*(+st.weight||0), 0);
      return { date: s.date, maxW, vol };
    });
  if (data.length < 2) { container.innerHTML = `<div class="chart-empty">Mindestens 2 Sessions nötig für den Chart.</div>`; return; }
  container.innerHTML = `
    <div class="chart-wrap"><div class="chart-label">Max. Gewicht (kg)</div>${svgLine(data, 'maxW', '#c8f135')}</div>
    <div class="chart-wrap"><div class="chart-label">Session Volumen (kg)</div>${svgLine(data, 'vol', '#7ec8e3')}</div>
  `;
}

function svgLine(data, field, color) {
  const W = 300, H = 110, PL = 38, PR = 10, PT = 8, PB = 28;
  const vals = data.map(d => d[field]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const xS = i => PL + (i / (data.length - 1)) * (W - PL - PR);
  const yS = v => PT + (1 - (v - min) / range) * (H - PT - PB);
  const path = data.map((d, i) => `${i ? 'L' : 'M'}${xS(i).toFixed(1)},${yS(d[field]).toFixed(1)}`).join('');
  const dots = data.map((d, i) => `<circle cx="${xS(i).toFixed(1)}" cy="${yS(d[field]).toFixed(1)}" r="3" fill="${color}"/>`).join('');
  const yLabels = [min, min + range/2, max].map(v =>
    `<text x="${PL-4}" y="${(yS(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-muted)">${Math.round(v)}</text>`).join('');
  const step = Math.max(1, Math.floor(data.length / 4));
  const xLabels = data.filter((_, i) => i % step === 0 || i === data.length-1).map((d, _, arr) => {
    const i = data.indexOf(d);
    return `<text x="${xS(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${new Date(d.date).toLocaleDateString('de-AT',{day:'numeric',month:'short'})}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
    ${yLabels}${xLabels}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

function renderKonsistenzHTML() {
  const sessions = db.history;
  if (!sessions.length) return `<div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-text">Noch keine Daten.</div></div>`;

  const now = Date.now();
  const msDay = 86400000, msWeek = 7 * msDay;

  // Avg sessions/week (last 8 weeks)
  const last8w = sessions.filter(s => now - s.date < 8 * msWeek);
  const avgPerWeek = (last8w.length / 8).toFixed(1);

  // Current streak (consecutive weeks with ≥1 session, going back from now)
  let streak = 0;
  for (let w = 0; w < 52; w++) {
    const hit = sessions.some(s => (now - s.date) >= w * msWeek && (now - s.date) < (w+1) * msWeek);
    if (hit) streak++; else break;
  }

  // Total sessions
  const total = sessions.length;

  // Heatmap: last 16 weeks × 7 days
  const weeks = 16;
  const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
  const todayMs = startOfToday.getTime();
  const heatmapStart = todayMs - (weeks * 7 - 1) * msDay;
  const sessionDates = new Set(sessions.map(s => {
    const d = new Date(s.date); d.setHours(0,0,0,0); return d.getTime();
  }));
  let heatHTML = '';
  for (let w = 0; w < weeks; w++) {
    heatHTML += '<div class="heatmap-week">';
    for (let d = 0; d < 7; d++) {
      const dayMs = heatmapStart + (w * 7 + d) * msDay;
      const active = sessionDates.has(dayMs);
      const future = dayMs > todayMs;
      heatHTML += `<div class="heatmap-day${active ? ' active' : future ? '' : ''}"></div>`;
    }
    heatHTML += '</div>';
  }

  return `<div style="padding:16px">
    <div class="stat-row">
      <div class="stat-card"><div class="stat-card-num">${avgPerWeek}×</div><div class="stat-card-label">Ø / Woche (8 Wo)</div></div>
      <div class="stat-card"><div class="stat-card-num">${streak}</div><div class="stat-card-label">Wochen-Streak</div></div>
      <div class="stat-card"><div class="stat-card-num">${total}</div><div class="stat-card-label">Sessions gesamt</div></div>
    </div>
    <div class="section-title">Letzte 16 Wochen</div>
    <div class="heatmap">${heatHTML}</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px">← älter · neuer →</div>
  </div>`;
}

renderHome();
</script>
