// Wie viele Übungszeilen und wie hoch der Wochenstreifen — beides richtet sich
// nach der tatsächlich freien Höhe, statt fix verdrahtet zu sein. Damit füllt
// der Startscreen jedes Gerät aus, ohne dass Restraum an einem Ende liegen bleibt.
const FOCUS_MIN_ROWS = 3;
const WEEK_CELL_MIN = 34, WEEK_CELL_MAX = 54;
const ROW_PAD_MIN = 11, ROW_PAD_MAX = 18;

function fitFocusPreview() {
  const card = document.getElementById('focus-card');
  const area = document.querySelector('#screen-home .scroll-area');
  if (!card || !area) return;

  const preview = document.getElementById('focus-preview');
  const rows = preview ? [...preview.querySelectorAll('.focus-preview-row')] : [];

  // Ausgangszustand: Minimum sichtbar, Streifen flach, Zeilen kompakt
  card.style.setProperty('--week-cell-h', WEEK_CELL_MIN + 'px');
  card.style.setProperty('--row-pad', ROW_PAD_MIN + 'px');
  rows.forEach((r, i) => r.classList.toggle('extra', i >= FOCUS_MIN_ROWS));

  // Natürliche Höhe = Blöcke + Lücken auf Minimum
  const naturalHeight = () => {
    card.style.flex = '0 0 auto';
    const h = card.getBoundingClientRect().height;
    card.style.flex = '';
    return h;
  };

  // clientHeight schließt die Paddings ein (u.a. der reservierte Platz für die
  // schwebende Tabbar). Fürs Einpassen zählt nur die echte Content-Höhe.
  const cs = getComputedStyle(area);
  const avail = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let free = avail - naturalHeight();

  // 1. Freien Platz zuerst in Übungszeilen stecken — die tragen Information.
  if (rows.length > FOCUS_MIN_ROWS && free > 0) {
    const rowH = rows[0].getBoundingClientRect().height;
    const extra = Math.min(rows.length - FOCUS_MIN_ROWS, Math.floor(free / rowH));
    if (extra > 0) {
      rows.forEach((r, i) => r.classList.toggle('extra', i >= FOCUS_MIN_ROWS + extra));
      free -= extra * rowH;
    }
  }

  // 2. Ein Teil des Rests macht den Wochenstreifen höher (gedeckelt).
  if (free > 0) {
    const grow = Math.min(WEEK_CELL_MAX - WEEK_CELL_MIN, Math.floor(free * 0.4));
    if (grow > 0) { card.style.setProperty('--week-cell-h', (WEEK_CELL_MIN + grow) + 'px'); free -= grow; }
  }

  // 3. Danach dürfen die Übungszeilen luftiger werden, statt dass der Platz
  //    als Lücke liegen bleibt.
  const visibleRows = rows.length - rows.filter(r => r.classList.contains('extra')).length;
  if (free > 0 && visibleRows > 0) {
    const perRow = Math.min(ROW_PAD_MAX - ROW_PAD_MIN, Math.floor(free * 0.5 / (visibleRows * 2)));
    if (perRow > 0) { card.style.setProperty('--row-pad', (ROW_PAD_MIN + perRow) + 'px'); free -= perRow * visibleRows * 2; }
  }
  // 4. Was dann noch übrig ist, verteilen die .focus-gap-Elemente gleichmäßig.

  const hidden = rows.filter(r => r.classList.contains('extra')).length;
  const toggle = preview && preview.querySelector('.focus-preview-toggle');
  const label = document.getElementById('focus-preview-label');
  if (toggle) {
    toggle.style.display = hidden === 0 ? 'none' : '';
    if (hidden > 0 && label) {
      const txt = `+${hidden} weitere Übung${hidden > 1 ? 'en' : ''}`;
      label.dataset.more = txt;
      label.textContent = txt;
    }
  }
}

function toggleFocusPreview() {
  const el = document.getElementById('focus-preview');
  if (!el) return;
  const expanding = !el.classList.contains('expanded');
  el.classList.toggle('expanded', expanding);
  const label = document.getElementById('focus-preview-label');
  if (expanding) {
    if (label) label.textContent = 'Weniger anzeigen';
  } else {
    fitFocusPreview(); // stellt die eingepasste Zeilenzahl wieder her
  }
}

// Drehen des Geräts oder Tastatur-Einblendung ändert die freie Höhe.
window.addEventListener('resize', () => {
  if (document.getElementById('screen-home').classList.contains('active')
      && !document.querySelector('.focus-preview.expanded')) fitFocusPreview();
});

function renderFocusHome() {
  const dateEl = document.getElementById('home-date');
  dateEl.textContent = new Date().toLocaleDateString('de-AT', { weekday: 'long', day: 'numeric', month: 'long' });

  const body = document.getElementById('focus-body');
  const draft = db.draftWorkout;

  if (draft) {
    const elapsed = draft.timerSeconds + Math.floor((Date.now() - draft.savedAt) / 1000);
    const m = Math.floor(elapsed / 60);
    body.innerHTML = `
      <div class="focus-card">
        <div class="focus-eyebrow draft">⚡ Training unterbrochen</div>
        <div class="focus-name">${draft.workoutState.dayName}</div>
        <div class="focus-meta">Unterbrochen vor ${m < 1 ? 'weniger als 1 min' : m + ' min'}</div>
        <button class="btn-primary" style="width:100%;margin-top:20px" onclick="resumeWorkout()">Fortsetzen <svg class="btn-ico-in fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
        <div class="focus-actions">
          <button class="btn-ghost" onclick="discardDraft()">Verwerfen</button>
        </div>
      </div>
    `;
    return;
  }

  const days = db.plan.days;
  if (!days.length) {
    body.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Noch kein Plan. Tippe ⚙️ um einen Plan zu erstellen.</div></div>`;
    return;
  }

  const suggestedDayId = getSuggestedDayId();
  const day = days.find(d => d.id === suggestedDayId) || days[0];

  // Letzte Session dieses Tages + Trend gegen die vorletzte
  const sessions = db.history.filter(h => h.dayId === day.id).sort((a, b) => b.date - a.date);
  const last = sessions[0] || null;
  const prev = sessions[1] || null;

  let metaHTML;
  if (!last) {
    metaHTML = `<div class="focus-meta-row">Erstes Mal</div>`;
  } else {
    const lastVol = calcSessionVol(last);
    const prevVol = prev ? calcSessionVol(prev) : null;
    const trend = (prevVol && prevVol > 0) ? Math.round((lastVol - prevVol) / prevVol * 100) : null;
    const lastSets = last.exercises.reduce((a, ex) => a + ex.sets.length, 0);
    const volLabel = lastVol > 0
      ? `${Math.round(lastVol).toLocaleString('de')} kg`
      : `${lastSets} Sets`;
    metaHTML = `
      <div class="focus-meta-row">
        <span>Zuletzt ${formatDate(last.date)}</span><span>·</span><span>${volLabel}</span>
        ${trend !== null ? `<span class="vol-trend ${trend >= 0 ? 'up' : 'down'}">${trend >= 0 ? '↑' : '↓'}${Math.abs(trend)}%</span>` : ''}
      </div>`;
  }

  // Nudge nur, wenn die Pause auffällig lang ist — sonst still bleiben.
  const gap = daysSinceLastTraining();
  const alertHTML = (gap !== null && gap >= 3)
    ? `<div class="focus-alert">⏳ Seit ${gap} Tagen nicht trainiert</div>`
    : '';

  // Erste 3 sichtbar, Rest hinter dem Toggle — Zeilen sind immer im DOM,
  // damit das Aufklappen ohne Re-Render funktioniert.
  const VISIBLE = 3;
  const more = Math.max(0, day.exercises.length - VISIBLE);
  const moreLabel = `+${more} weitere Übung${more > 1 ? 'en' : ''}`;
  const previewHTML = day.exercises.length ? `
    <div class="focus-preview" id="focus-preview">
      ${day.exercises.map((ex, i) => `
        <div class="focus-preview-row${i >= VISIBLE ? ' extra' : ''}">
          <div class="focus-preview-name">${ex.name}</div>
          <div class="focus-preview-sets">${ex.sets}×${ex.targetReps}</div>
        </div>`).join('')}
      ${more > 0 ? `
        <button class="focus-preview-toggle" onclick="toggleFocusPreview()">
          <span id="focus-preview-label" data-more="${moreLabel}">${moreLabel}</span>
          <span class="focus-preview-chevron">▼</span>
        </button>` : ''}
    </div>` : '';

  // Heutiger Status sichtbar machen, statt den Link stumm auszublenden.
  const todayEntries = getTodayEntries();
  const restToday = todayEntries.find(h => h.type === 'activeRest');
  const trainedToday = todayEntries.find(h => h.dayId);
  // Nichts geloggt → zwei graue Buttons nebeneinander.
  // Schon was geloggt → Status-Chip statt Erholungs-Button.
  let actionsHTML;
  if (restToday) {
    actionsHTML = `
      <div class="focus-actions">
        <button class="btn-ghost" onclick="showScreen('screen-overview')">Alle Tage</button>
      </div>
      <div class="focus-status">✓ Aktive Erholung heute geloggt</div>`;
  } else if (trainedToday) {
    actionsHTML = `
      <div class="focus-actions">
        <button class="btn-ghost" onclick="showScreen('screen-overview')">Alle Tage</button>
      </div>
      <div class="focus-status trained">✓ Heute trainiert: ${trainedToday.dayName}</div>`;
  } else {
    actionsHTML = `
      <div class="focus-actions">
        <button class="btn-ghost" onclick="showScreen('screen-overview')">Alle Tage</button>
        <button class="btn-ghost" onclick="logActiveRest()">Aktive Erholung</button>
      </div>`;
  }

  body.innerHTML = `
    <div class="focus-card" id="focus-card">
      ${alertHTML}
      <div class="focus-eyebrow">Nächstes Training</div>
      <div class="focus-name">${day.name}</div>
      ${metaHTML}
      <div class="focus-gap sm"></div>
      ${renderWeekStrip()}
      <div class="focus-gap"></div>
      ${previewHTML}
      <div class="focus-gap"></div>
      <div>
        <button class="btn-primary" style="width:100%" onclick="startWorkoutForDay('${day.id}')">Training starten <svg class="btn-ico-in fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
        ${actionsHTML}
      </div>
    </div>
  `;

  fitFocusPreview();
}

function startWorkoutForDay(dayId) {
  pendingDayId = dayId;
  startWorkout();
}

// ─── OVERVIEW ─────────────────────────────────────────────────────────────────

function renderOverview() {
  const list = document.getElementById('day-list');
  const days = db.plan.days;

  if (!days.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Noch kein Plan. Tippe ⚙️ um einen Plan zu erstellen.</div></div>`;
    return;
  }

  const suggestedDayId = getSuggestedDayId();

  list.innerHTML = days.map(day => {
    const color = getDayColor(day.id);
    const sessions = db.history.filter(h => h.dayId === day.id).sort((a, b) => b.date - a.date);

    // Links = vor 4 Wochen, rechts = diese Woche (liest sich als Zeitstrahl).
    const weekDots = [3,2,1,0].map(w => {
      const hit = sessions.some(s => {
        const ago = calendarDaysAgo(s.date);
        return ago >= w * 7 && ago < (w + 1) * 7;
      });
      return `<div class="week-dot ${hit ? 'active' : ''}"></div>`;
    }).join('');

    let metaHTML;
    if (!sessions.length) {
      metaHTML = `<div class="day-row-meta empty">Noch kein Training</div>`;
    } else {
      const last = sessions[0];
      const prev = sessions[1] || null;
      const lastVol = calcSessionVol(last);
      const prevVol = prev ? calcSessionVol(prev) : null;
      const trend = (prevVol && prevVol > 0) ? Math.round((lastVol - prevVol) / prevVol * 100) : null;
      const lastSets = last.exercises.reduce((a, ex) => a + ex.sets.length, 0);
      const lastMin = Math.floor((last.duration || 0) / 60);
      const volLabel = lastVol > 0
        ? `${Math.round(lastVol).toLocaleString('de')} kg`
        : `${lastSets} Sets`;
      const trendHTML = trend !== null
        ? `<span class="vol-trend ${trend >= 0 ? 'up' : 'down'}">${trend >= 0 ? '↑' : '↓'}${Math.abs(trend)}%</span>`
        : '';
      metaHTML = `
        <div class="day-row-meta">
          <span>${formatDate(last.date)}</span><span>·</span>
          <span class="day-row-vol">${volLabel}</span>${trendHTML}
          ${lastMin ? `<span>· ${lastMin} min</span>` : ''}
        </div>`;
    }

    // --day-color faerbt im neuen Design die ganze Karte leicht ein und
    // leuchtet aus der Oberkante, statt als Streifen links zu sitzen.
    // Wie vorher nur bei Tagen mit Sessions — farbig heisst "hier lief was".
    const rowStyle = `--dot-color:${color}` + (sessions.length ? `;--day-color:${color}` : '');

    return `
      <div class="day-row" style="${rowStyle}" onclick="previewDay('${day.id}')">
        <div class="day-row-main">
          <div class="day-row-head">
            <span class="day-row-name">${day.name}</span>
            ${day.id === suggestedDayId ? '<span class="day-row-badge">Empfohlen</span>' : ''}
          </div>
          ${metaHTML}
          <div class="day-row-dots">
            ${weekDots}<span class="day-row-dots-label">letzte 4 Wochen</span>
          </div>
        </div>
        <div class="day-row-chevron">›</div>
      </div>
    `;
  }).join('');
}

function logActiveRest() {
  // Schutz gegen doppelte Einträge, falls die Ansicht veraltet ist.
  if (hasEntryToday()) {
    renderFocusHome();
    showToast('Für heute gibt es schon einen Eintrag');
    return;
  }
  showConfirm(
    'Aktive Erholung loggen?',
    'Heute wird als Erholungstag festgehalten — zählt für Streak & Heatmap, aber nicht als Training.',
    () => {
      db.history.unshift({
        id: Date.now().toString(), planId: db.plan.id, dayId: null, dayName: 'Aktive Erholung',
        date: Date.now(), duration: 0, type: 'activeRest', exercises: []
      });
      saveDB();
      closeModal('modal-confirm');
      renderFocusHome();
      showToast('Aktive Erholung geloggt ✓');
    }
  );
}

function getSuggestedDayId() {
  const days = db.plan.days;
  if (!days.length) return null;
  const trainingSessions = db.history.filter(h => h.dayId).sort((a, b) => b.date - a.date);
  if (!trainingSessions.length) return days[0].id;
  const idx = days.findIndex(d => d.id === trainingSessions[0].dayId);
  if (idx === -1) return days[0].id;
  return days[(idx + 1) % days.length].id;
}

function getLastSession(dayId) {
  const sessions = db.history.filter(h => h.dayId === dayId);
  if (!sessions.length) return null;
  return sessions.sort((a, b) => b.date - a.date)[0];
}

function formatDate(ts) {
  const diff = calendarDaysAgo(ts);
  if (diff <= 0) return 'Heute';
  if (diff === 1) return 'Gestern';
  if (diff === 2) return 'Vorgestern';
  if (diff < 7) return `vor ${diff} Tagen`;
  return new Date(ts).toLocaleDateString('de-AT', { day: 'numeric', month: 'short' });
}

// ─── WORKOUT ──────────────────────────────────────────────────────────────────

let workoutState = null;
let timerInterval = null;
let timerSeconds = 0;
let pendingDayId = null;

function previewDay(dayId) {
  const day = db.plan.days.find(d => d.id === dayId);
  if (!day) return;
  pendingDayId = dayId;

  document.getElementById('preview-title').textContent = day.name;

  const lastSession = getLastSession(dayId);
  const body = document.getElementById('preview-body');
  const lastDate = lastSession
    ? formatDate(lastSession.date)
    : null;

  body.innerHTML = `
    <div class="preview-hero">
      <div class="preview-hero-name">${day.name}</div>
      <div class="preview-hero-sub">${day.exercises.length} Übungen${lastDate ? ' · Zuletzt ' + lastDate : ' · Erstes Mal'}</div>
    </div>
    <div class="preview-ex-list">
      ${day.exercises.map(ex => {
        const lastEx = lastSession && lastSession.exercises.find(e => e.exId === ex.id);
        const lastLine = lastEx
          ? lastEx.sets.map(s => `${s.reps}×${s.weight}kg`).join(' ')
          : '—';
        return `
          <div class="preview-ex-item">
            <div class="preview-ex-name">${ex.name}</div>
            <div class="preview-ex-meta">${ex.sets}×${ex.targetReps}</div>
            <div class="preview-ex-last">${lastLine}</div>
          </div>`;
      }).join('')}
    </div>
  `;

  showScreen('screen-day-preview');
}

function startWorkout() {
  const dayId = pendingDayId;
  const day = db.plan.days.find(d => d.id === dayId);
  if (!day) return;

  // Build workout state
  const lastSession = getLastSession(dayId);

  workoutState = {
    dayId: dayId,
    dayName: day.name,
    startTime: Date.now(),
    exercises: day.exercises.map(ex => {
      // Find last values for this exercise
      let lastSets = [];
      if (lastSession) {
        const lastEx = lastSession.exercises.find(e => e.exId === ex.id);
        if (lastEx) lastSets = lastEx.sets;
      }
      return {
        exId: ex.id,
        name: ex.name,
        targetReps: ex.targetReps,
        weightStep: ex.weightStep || 2.5,
        restSeconds: ex.restSeconds || 90,
        sets: Array.from({ length: ex.sets }, (_, i) => {
          const prev = lastSets[i];
          return {
            reps: prev ? prev.reps : '',
            weight: prev ? prev.weight : '',
            done: false
          };
        }),
        lastSets: lastSets
      };
    })
  };

  prShownForEx = new Set();
  renderWorkout();
  showScreen('screen-workout');
  startTimer();
  requestWakeLock();
}

function saveWorkoutDraft() {
  db.draftWorkout = {
    workoutState: JSON.parse(JSON.stringify(workoutState)),
    timerSeconds: timerSeconds,
    savedAt: Date.now()
  };
  saveDB();
}

function resumeWorkout() {
  const draft = db.draftWorkout;
  if (!draft) return;
  workoutState = draft.workoutState;
  const totalElapsed = draft.timerSeconds + Math.floor((Date.now() - draft.savedAt) / 1000);
  workoutState.startTime = Date.now() - totalElapsed * 1000;
  prShownForEx = new Set();
  renderWorkout();
  showScreen('screen-workout');
  startTimer();
  requestWakeLock();
}

function discardDraft() {
  db.draftWorkout = null;
  saveDB();
  renderFocusHome();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!workoutState) { clearInterval(timerInterval); return; }
    timerSeconds = Math.floor((Date.now() - workoutState.startTime) / 1000);
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    document.getElementById('workout-timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

// ─── REST TIMER ───────────────────────────────────────────────────────────────

let restTimerInterval = null;
let restTimerEndsAt = 0;

function startRestTimer(seconds) {
  clearInterval(restTimerInterval);
  restTimerEndsAt = Date.now() + seconds * 1000;
  const banner = document.getElementById('rest-timer-banner');
  banner.classList.remove('done');
  banner.style.display = 'flex';
  tickRestTimer();
  restTimerInterval = setInterval(tickRestTimer, 250);
}

function tickRestTimer() {
  const banner = document.getElementById('rest-timer-banner');
  const numEl = document.getElementById('rest-timer-num');
  if (!banner || banner.style.display === 'none') { clearInterval(restTimerInterval); return; }
  const remaining = Math.max(0, Math.ceil((restTimerEndsAt - Date.now()) / 1000));
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  numEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  if (remaining <= 0) {
    clearInterval(restTimerInterval);
    banner.classList.add('done');
    if (navigator.vibrate) navigator.vibrate([200,100,200]);
    setTimeout(() => { banner.style.display = 'none'; }, 1500);
  }
}

function cancelRestTimer() {
  clearInterval(restTimerInterval);
  document.getElementById('rest-timer-banner').style.display = 'none';
}

// ─── WAKE LOCK ────────────────────────────────────────────────────────────────

let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch(e) {}
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (workoutState) { requestWakeLock(); return; }
  // Datumswechsel abfangen: liegt die App über Mitternacht im Hintergrund,
  // muss der Startscreen neu bewerten, ob heute schon etwas geloggt ist.
  if (document.getElementById('screen-home').classList.contains('active')) renderFocusHome();
});

function renderWorkout() {
  if (!workoutState) return;
  document.getElementById('workout-title').textContent = workoutState.dayName;
  updateWorkoutProgress();

  const body = document.getElementById('workout-body');
  body.innerHTML = workoutState.exercises.map((ex, ei) => {
    const doneSets = ex.sets.filter(s => s.done).length;
    const progress = ex.sets.length ? (doneSets / ex.sets.length) * 100 : 0;

    const setsHTML = ex.sets.map((set, si) => {
      const prevSet = ex.lastSets[si];
      const repsWidget = `<div class="num-widget reps-widget">
            <button class="num-btn" onclick="adjustVal(${ei},${si},'reps',-1)">−</button>
            <input class="num-input" type="number" inputmode="numeric"
              value="${set.reps}"
              placeholder="${ex.targetReps.split('-')[0]}"
              onchange="setVal(${ei},${si},'reps',this.value)"
              oninput="setVal(${ei},${si},'reps',this.value)">
            <button class="num-btn" onclick="adjustVal(${ei},${si},'reps',1)">+</button>
          </div>`;
      return `
        <div class="set-row ${set.done ? 'done' : ''}" id="set-${ei}-${si}">
          ${repsWidget}
          <div class="num-widget weight-widget">
            <button class="num-btn" onclick="adjustVal(${ei},${si},'weight',${-(ex.weightStep || 2.5)})">−</button>
            <input class="num-input" type="number" inputmode="decimal"
              value="${set.weight}"
              placeholder="${prevSet ? prevSet.weight : '0'}"
              onchange="setVal(${ei},${si},'weight',this.value)"
              oninput="setVal(${ei},${si},'weight',this.value)">
            <button class="num-btn" onclick="adjustVal(${ei},${si},'weight',${ex.weightStep || 2.5})">+</button>
          </div>
          <button class="rest-btn" onclick="startRestTimer(${ex.restSeconds || 90})" title="Pause starten">⏱</button>
        </div>
      `;
    }).join('');

    return `
      <div class="exercise-block">
        <div class="exercise-header">
          <div class="exercise-name">${ex.name}</div>
          <div class="exercise-target">${ex.targetReps} reps</div>
        </div>
        <div class="exercise-progress"><div class="exercise-progress-fill" id="prog-${ei}" style="width:${progress}%"></div></div>
        <div class="set-cols-header">
          <div class="set-col-label reps-col">reps</div>
          <div class="set-col-label weight-col">kg</div>
        </div>
        ${setsHTML}
      </div>
    `;
  }).join('');
}

function updateWorkoutProgress() {
  if (!workoutState) return;
  const total = workoutState.exercises.reduce((a, ex) => a + ex.sets.length, 0);
  const done = workoutState.exercises.reduce((a, ex) => a + ex.sets.filter(s => s.done).length, 0);
  document.getElementById('workout-progress-text').textContent = `${done} / ${total} Sets`;
}

function isSetCommitted(set) {
  return (set.reps !== '' && parseFloat(set.reps) > 0) ||
         (set.weight !== '' && parseFloat(set.weight) > 0);
}

function adjustVal(ei, si, field, delta) {
  const set = workoutState.exercises[ei].sets[si];
  const current = parseFloat(set[field]) || 0;
  const newVal = Math.max(0, +(current + delta).toFixed(4));
  set[field] = newVal;
  const row = document.getElementById(`set-${ei}-${si}`);
  const selector = field === 'reps' ? '.reps-widget .num-input' : '.weight-widget .num-input';
  row.querySelector(selector).value = newVal;
  onValChangedWithPR(ei, si);
}

function setVal(ei, si, field, val) {
  workoutState.exercises[ei].sets[si][field] = val === '' ? '' : parseFloat(val) || 0;
  onValChangedWithPR(ei, si);
}

function onValChanged(ei, si) {
  const set = workoutState.exercises[ei].sets[si];
  set.done = isSetCommitted(set);

  const row = document.getElementById(`set-${ei}-${si}`);
  row.classList.toggle('done', set.done);

  const ex = workoutState.exercises[ei];
  const doneSets = ex.sets.filter(s => s.done).length;
  const progFill = document.getElementById(`prog-${ei}`);
  if (progFill) progFill.style.width = `${(doneSets / ex.sets.length) * 100}%`;

  updateWorkoutProgress();
  saveWorkoutDraft();
}

function confirmExitWorkout() {
  const doneSets = workoutState.exercises.reduce((a, ex) => a + ex.sets.filter(isSetCommitted).length, 0);
  if (doneSets === 0) {
    exitWorkout();
    return;
  }
  showConfirm(
    'Training abbrechen?',
    'Der aktuelle Fortschritt geht verloren.',
    exitWorkout
  );
}

function exitWorkout() {
  clearInterval(timerInterval);
  cancelRestTimer();
  releaseWakeLock();
  workoutState = null;
  db.draftWorkout = null;
  saveDB();
  closeModal('modal-confirm');
  showScreen('screen-home');
}

function finishWorkout() {
  if (!workoutState) return;
  clearInterval(timerInterval);
  cancelRestTimer();
  releaseWakeLock();
  db.draftWorkout = null;

  // Save to history
  const session = {
    id: Date.now().toString(),
    planId: db.plan.id,
    dayId: workoutState.dayId,
    dayName: workoutState.dayName,
    date: Date.now(),
    duration: timerSeconds,
    exercises: workoutState.exercises.map(ex => ({
      exId: ex.exId,
      name: ex.name,
      sets: ex.sets.filter(isSetCommitted).map(s => ({ reps: +s.reps || 0, weight: +s.weight || 0 }))
    })).filter(ex => ex.sets.length > 0)
  };

  db.history.unshift(session);
  saveDB();

  // Show finish screen
  const totalSets = session.exercises.reduce((a, ex) => a + ex.sets.length, 0);
  const totalVol = session.exercises.reduce((a, ex) => a + ex.sets.reduce((b, s) => b + s.reps * s.weight, 0), 0);
  const min = Math.floor(timerSeconds / 60);

  const isDayPR = checkDayPR(session.dayId, totalVol);
  document.getElementById('finish-icon').textContent = isDayPR ? '🏆' : '🏋️';
  document.getElementById('finish-pr-badge').innerHTML = isDayPR
    ? `<div class="finish-pr-badge">⚡ Neuer Bestwert für ${session.dayName}!</div>` : '';
  document.getElementById('finish-sub').textContent = workoutState.dayName + ' · ' + new Date().toLocaleDateString('de-AT', { day: 'numeric', month: 'long' });
  document.getElementById('finish-stats').innerHTML = `
    <div class="finish-stat"><div class="finish-stat-num">${totalSets}</div><div class="finish-stat-label">Sets</div></div>
    <div class="finish-stat"><div class="finish-stat-num">${min}m</div><div class="finish-stat-label">Dauer</div></div>
    <div class="finish-stat"><div class="finish-stat-num">${session.exercises.length}</div><div class="finish-stat-label">Übungen</div></div>
    <div class="finish-stat"><div class="finish-stat-num">${Math.round(totalVol).toLocaleString('de')}</div><div class="finish-stat-label">kg Volumen</div></div>
  `;

  workoutState = null;
  showScreen('screen-finish');
}

let drag = null;

function onExDragStart(e, dayId, exIdx) {
  e.preventDefault();
  const row = document.getElementById(`pex-${dayId}-${exIdx}`);
  const rect = row.getBoundingClientRect();
  const touch = e.touches[0];

  const ph = document.createElement('div');
  ph.className = 'drag-ph';
  ph.style.height = rect.height + 'px';
  row.parentNode.insertBefore(ph, row);

  row.classList.add('dragging');
  row.style.cssText = `position:fixed;left:${rect.left}px;width:${rect.width}px;top:${rect.top}px;z-index:999;background:var(--surface2);border-radius:var(--radius-sm);padding:8px;box-shadow:0 8px 24px rgba(0,0,0,0.5);`;

  drag = { dayId, exIdx, row, ph, offsetY: touch.clientY - rect.top };

  document.addEventListener('touchmove', onExDragMove, { passive: false });
  document.addEventListener('touchend', onExDragEnd, { once: true });
}

function onExDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  const touch = e.touches[0];
  drag.row.style.top = (touch.clientY - drag.offsetY) + 'px';

  drag.row.style.display = 'none';
  const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
  drag.row.style.display = '';
  const rowUnder = elUnder?.closest('[data-ex-row]');
  if (rowUnder) {
    const rect = rowUnder.getBoundingClientRect();
    if (touch.clientY < rect.top + rect.height / 2) {
      rowUnder.parentNode.insertBefore(drag.ph, rowUnder);
    } else {
      rowUnder.parentNode.insertBefore(drag.ph, rowUnder.nextSibling);
    }
  }
}

function onExDragEnd() {
  if (!drag) return;
  document.removeEventListener('touchmove', onExDragMove);

  const { dayId, exIdx, row, ph } = drag;
  drag = null;

  const container = ph.parentNode;
  const children = [...container.children];
  const phIdx = children.indexOf(ph);
  const newIdx = children.slice(0, phIdx).filter(el => el.hasAttribute('data-ex-row')).length;

  ph.remove();
  row.style.cssText = '';
  row.classList.remove('dragging');

  if (newIdx !== exIdx) {
    const day = db.plan.days.find(d => d.id === dayId);
    const [moved] = day.exercises.splice(exIdx, 1);
    day.exercises.splice(newIdx, 0, moved);
    saveDB();
  }
  renderPlan(dayId);
}

function exportData() {
  const json = JSON.stringify(db, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url; a.download = `tvrd_backup_${date}.json`;

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.plan || !parsed.history) throw new Error('Ungültiges Format');
      parsed.version = parsed.version || CURRENT_VERSION;
      const migrated = migrateDB(parsed);
      localStorage.setItem(DB_KEY, JSON.stringify(migrated));
      showToast('Import erfolgreich — App wird neu geladen…');
      setTimeout(() => location.reload(), 1200);
    } catch(err) {
      showToast('Import fehlgeschlagen: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ─── PR SYSTEM ────────────────────────────────────────────────────────────────

let prShownForEx = new Set();
let prCheckTimers = {};

function getExBests(exId) {
  let bestWeight = 0, bestSetVol = 0, bestSessionVol = 0;
  db.history.forEach(session => {
    const ex = session.exercises.find(e => e.exId === exId);
    if (!ex) return;
    let sessionVol = 0;
    ex.sets.forEach(s => {
      bestWeight = Math.max(bestWeight, +s.weight || 0);
      bestSetVol = Math.max(bestSetVol, (+s.reps || 0) * (+s.weight || 0));
      sessionVol += (+s.reps || 0) * (+s.weight || 0);
    });
    bestSessionVol = Math.max(bestSessionVol, sessionVol);
  });
  return { bestWeight, bestSetVol, bestSessionVol };
}

// Anzahl vergangener Sessions mit echten Sets für diese Übung.
// 0 = Erstes Mal → es gibt nichts zu schlagen, also kein PR.
function getExSessionCount(exId) {
  return db.history.filter(s => s.exercises.some(e => e.exId === exId && e.sets.length)).length;
}

function checkSetAndExPR(ei, si) {
  // Der Aufruf kommt 600ms verzögert. Wird das Training in der Zwischenzeit
  // beendet oder abgebrochen, gibt es keinen State mehr zu prüfen.
  if (!workoutState) return;
  const ex = workoutState.exercises[ei];
  const set = ex.sets[si];
  const reps = +set.reps || 0;
  const weight = +set.weight || 0;
  if (!reps && !weight) return;

  // PR-Feature aktiviert sich erst, wenn ein Vergleichswert existiert.
  if (getExSessionCount(ex.exId) === 0) return;

  const bests = getExBests(ex.exId);
  const setVol = reps * weight;
  const isWeightPR = weight > 0 && weight > bests.bestWeight;
  const isVolPR = setVol > 0 && setVol > bests.bestSetVol;

  if (isWeightPR || isVolPR) {
    const row = document.getElementById(`set-${ei}-${si}`);
    if (row) {
      row.querySelectorAll('.pr-badge').forEach(b => b.remove());
      row.classList.remove('pr-row-flash');
      void row.offsetWidth;
      row.classList.add('pr-row-flash');
      row.style.position = 'relative';
      const badge = document.createElement('div');
      badge.className = 'pr-badge';
      badge.textContent = isWeightPR ? '⚡ Gewicht PR' : '⚡ Volumen PR';
      row.appendChild(badge);
      setTimeout(() => badge.remove(), 2700);
    }
  }

  // Exercise PR: current session total vs. all-time session best for this exercise
  const sessionExVol = ex.sets.reduce((a, s) => a + (+s.reps||0)*(+s.weight||0), 0);
  if (sessionExVol > bests.bestSessionVol && sessionExVol > 0 && !prShownForEx.has(ei)) {
    prShownForEx.add(ei);
    const block = document.getElementById(`prog-${ei}`)?.closest('.exercise-block');
    if (block) {
      block.classList.remove('pr-ex-glow');
      void block.offsetWidth;
      block.classList.add('pr-ex-glow');
      const exBadge = document.createElement('div');
      exBadge.className = 'pr-badge';
      exBadge.style.cssText = 'position:absolute;right:12px;top:12px;';
      exBadge.textContent = '🏆 Übungs-PR';
      block.style.position = 'relative';
      block.appendChild(exBadge);
      setTimeout(() => exBadge.remove(), 3000);
    }
  }
}

function onValChangedWithPR(ei, si) {
  onValChanged(ei, si);
  clearTimeout(prCheckTimers[`${ei}-${si}`]);
  prCheckTimers[`${ei}-${si}`] = setTimeout(() => checkSetAndExPR(ei, si), 600);
}

function checkDayPR(dayId, totalVol) {
  if (totalVol <= 0) return false;
  // slice(1) überspringt die gerade gespeicherte Session.
  const prior = db.history.slice(1).filter(s => s.dayId === dayId && s.exercises.length);
  if (!prior.length) return false; // Erstes Mal für diesen Tag → kein Bestwert möglich
  const prevBest = Math.max(...prior.map(s =>
    s.exercises.reduce((a, ex) => a + ex.sets.reduce((b, st) => b + (+st.reps||0)*(+st.weight||0), 0), 0)
  ), 0);
  return totalVol > prevBest;
}

// ─── ANALYTICS ────────────────────────────────────────────────────────────────

let currentAnalyticsTab = 'verlauf';

function switchAnalyticsTab(tab, el) {
  currentAnalyticsTab = tab;
  document.querySelectorAll('.analytics-tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  renderAnalytics(tab);
}

function renderAnalytics(tab) {
  tab = tab || currentAnalyticsTab;
  const body = document.getElementById('analytics-body');
  if (!body) return;

  if (tab === 'verlauf') {
    body.innerHTML = renderVerlaufHTML();
  } else if (tab === 'prs') {
    body.innerHTML = renderPRBoardHTML();
  } else if (tab === 'progression') {
    body.innerHTML = renderProgressionHTML();
    setupProgSelect();
  } else if (tab === 'konsistenz') {
    body.innerHTML = renderKonsistenzHTML();
  }
}

function renderVerlaufHTML() {
  const sessions = db.history;
  if (!sessions.length) return `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">Noch keine Sessions.</div></div>`;
  return sessions.map(session => {
    const d = new Date(session.date);
    const dateStr = d.toLocaleDateString('de-AT', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    const min = Math.floor((session.duration || 0) / 60);
    const totalSets = session.exercises.reduce((a, ex) => a + ex.sets.length, 0);
    const exHTML = session.exercises.map(ex => `
      <div class="history-ex-row">
        <div class="history-ex-name">${ex.name}</div>
        <div class="history-set-pills">${ex.sets.map((s,i) => `<span class="history-set-pill">S${i+1}: ${s.reps}r · ${s.weight}kg</span>`).join('')}</div>
      </div>`).join('');
    return `
      <div class="history-session">
        <div class="history-session-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <div><div class="history-session-date">${session.dayName}</div><div class="history-session-meta">${dateStr} · ${totalSets} Sets${min ? ' · '+min+'min' : ''}</div></div>
          <div style="color:var(--text-muted);font-size:18px">›</div>
        </div>
        <div class="history-session-body" id="vs-${session.id}">${exHTML}</div>
      </div>`;
  }).join('');
}

function renderPRBoardHTML() {
  const allExIds = new Map();
  db.history.forEach(s => s.exercises.forEach(ex => {
    if (!allExIds.has(ex.exId)) allExIds.set(ex.exId, ex.name);
  }));
  if (!allExIds.size) return `<div class="empty-state"><div class="empty-state-icon">🏆</div><div class="empty-state-text">Noch keine PRs — training starten!</div></div>`;

  const rows = [...allExIds.entries()].map(([exId, name]) => {
    let bestWeight = 0, bestWeightDate = null;
    let bestSetVol = 0, bestSetVolDate = null;
    db.history.forEach(s => {
      const ex = s.exercises.find(e => e.exId === exId);
      if (!ex) return;
      ex.sets.forEach(st => {
        if ((+st.weight||0) > bestWeight) { bestWeight = +st.weight; bestWeightDate = s.date; }
        const sv = (+st.reps||0)*(+st.weight||0);
        if (sv > bestSetVol) { bestSetVol = sv; bestSetVolDate = s.date; }
      });
    });
    const fmt = ts => new Date(ts).toLocaleDateString('de-AT', { day:'numeric', month:'short' });
    return `<tr>
      <td class="pr-ex-name-cell">${name}</td>
      <td><div class="pr-val">${bestWeight > 0 ? bestWeight+'kg' : '—'}</div>${bestWeightDate ? `<div class="pr-date">${fmt(bestWeightDate)}</div>` : ''}</td>
      <td><div class="pr-val">${bestSetVol > 0 ? Math.round(bestSetVol)+'kg' : '—'}</div>${bestSetVolDate ? `<div class="pr-date">${fmt(bestSetVolDate)}</div>` : ''}</td>
    </tr>`;
  }).join('');

  return `<div style="padding:16px">
    <table class="pr-table">
      <thead><tr><th>Übung</th><th>Max Gewicht</th><th>Set Volumen</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderProgressionHTML() {
  const allExIds = new Map();
  db.history.forEach(s => s.exercises.forEach(ex => {
    if (!allExIds.has(ex.exId)) allExIds.set(ex.exId, ex.name);
  }));
  const options = [...allExIds.entries()].map(([id, name]) => `<option value="${id}">${name}</option>`).join('');
  return `<div style="padding:16px">
    <select class="prog-select" id="prog-ex-select" onchange="renderProgCharts(this.value)">
      <option value="">— Übung wählen —</option>${options}
    </select>
    <div id="prog-charts"></div>
  </div>`;
}

function setupProgSelect() {
  const sel = document.getElementById('prog-ex-select');
  if (sel && sel.options.length > 1) {
    sel.selectedIndex = 1;
    renderProgCharts(sel.value);
  }
}

function renderProgCharts(exId) {
  const container = document.getElementById('prog-charts');
  if (!container || !exId) return;
  const data = db.history
    .filter(s => s.exercises.some(e => e.exId === exId))
    .sort((a, b) => a.date - b.date)
    .map(s => {
      const ex = s.exercises.find(e => e.exId === exId);
      const maxW = Math.max(...ex.sets.map(st => +st.weight || 0));
      const vol = ex.sets.reduce((a, st) => a + (+st.reps||0)*(+st.weight||0), 0);
      return { date: s.date, maxW, vol };
    });
  if (data.length < 2) { container.innerHTML = `<div class="chart-empty">Mindestens 2 Sessions nötig für den Chart.</div>`; return; }
  container.innerHTML = `
    <div class="chart-wrap"><div class="chart-label">Max. Gewicht (kg)</div>${svgLine(data, 'maxW', '#c8f135')}</div>
    <div class="chart-wrap"><div class="chart-label">Session Volumen (kg)</div>${svgLine(data, 'vol', '#7ec8e3')}</div>
  `;
}

function svgLine(data, field, color) {
  const W = 300, H = 110, PL = 38, PR = 10, PT = 8, PB = 28;
  const vals = data.map(d => d[field]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const xS = i => PL + (i / (data.length - 1)) * (W - PL - PR);
  const yS = v => PT + (1 - (v - min) / range) * (H - PT - PB);
  const path = data.map((d, i) => `${i ? 'L' : 'M'}${xS(i).toFixed(1)},${yS(d[field]).toFixed(1)}`).join('');
  const dots = data.map((d, i) => `<circle cx="${xS(i).toFixed(1)}" cy="${yS(d[field]).toFixed(1)}" r="3" fill="${color}"/>`).join('');
  const yLabels = [min, min + range/2, max].map(v =>
    `<text x="${PL-4}" y="${(yS(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-muted)">${Math.round(v)}</text>`).join('');
  const step = Math.max(1, Math.floor(data.length / 4));
  const xLabels = data.filter((_, i) => i % step === 0 || i === data.length-1).map((d, _, arr) => {
    const i = data.indexOf(d);
    return `<text x="${xS(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${new Date(d.date).toLocaleDateString('de-AT',{day:'numeric',month:'short'})}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">
    ${yLabels}${xLabels}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

function renderKonsistenzHTML() {
  const sessions = db.history;
  if (!sessions.length) return `<div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-text">Noch keine Daten.</div></div>`;

  const now = Date.now();
  const msDay = 86400000, msWeek = 7 * msDay;

  // Avg sessions/week (last 8 weeks)
  const last8w = sessions.filter(s => now - s.date < 8 * msWeek);
  const avgPerWeek = (last8w.length / 8).toFixed(1);

  // Current streak (consecutive weeks with ≥1 session, going back from now)
  let streak = 0;
  for (let w = 0; w < 52; w++) {
    const hit = sessions.some(s => (now - s.date) >= w * msWeek && (now - s.date) < (w+1) * msWeek);
    if (hit) streak++; else break;
  }

  // Total sessions
  const total = sessions.length;

  // Heatmap: last 16 weeks × 7 days, color-coded by training day type
  const weeks = 16;
  // Zellen über echte Kalendertage aufbauen, nicht über ms-Addition —
  // sonst verschiebt sich das Raster bei der Zeitumstellung um einen Tag.
  const cellMs = n => {
    const d = new Date(); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - (weeks * 7 - 1) + n);
    return d.getTime();
  };

  const sessionsByDate = new Map();
  sessions.forEach(s => {
    const d = new Date(s.date); d.setHours(0,0,0,0);
    const key = d.getTime();
    if (!sessionsByDate.has(key)) sessionsByDate.set(key, []);
    sessionsByDate.get(key).push(s);
  });

  let heatHTML = '';
  for (let w = 0; w < weeks; w++) {
    heatHTML += '<div class="heatmap-week">';
    for (let d = 0; d < 7; d++) {
      const dayMs = cellMs(w * 7 + d);
      const daySessions = sessionsByDate.get(dayMs);
      let cellColor = '';
      if (daySessions) {
        let bestIdx = Infinity, best = null;
        daySessions.forEach(s => {
          const idx = db.plan.days.findIndex(pd => pd.id === s.dayId);
          if (idx !== -1 && idx < bestIdx) { bestIdx = idx; best = getDayColor(s.dayId); }
        });
        cellColor = best || REST_COLOR;
      }
      heatHTML += `<div class="heatmap-day"${cellColor ? ` style="background:${cellColor}"` : ''}></div>`;
    }
    heatHTML += '</div>';
  }

  const hasRestEntries = sessions.some(s => !s.dayId);
  const legendHTML = `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">
    ${db.plan.days.map(d => `<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim)"><span style="width:8px;height:8px;border-radius:50%;background:${getDayColor(d.id)};display:inline-block;flex-shrink:0"></span>${d.name}</div>`).join('')}
    ${hasRestEntries ? `<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim)"><span style="width:8px;height:8px;border-radius:50%;background:${REST_COLOR};display:inline-block;flex-shrink:0"></span>Aktive Erholung</div>` : ''}
  </div>`;

  return `<div style="padding:16px">
    <div class="stat-row">
      <div class="stat-card"><div class="stat-card-num">${avgPerWeek}×</div><div class="stat-card-label">Ø / Woche (8 Wo)</div></div>
      <div class="stat-card"><div class="stat-card-num">${streak}</div><div class="stat-card-label">Wochen-Streak</div></div>
      <div class="stat-card"><div class="stat-card-num">${total}</div><div class="stat-card-label">Sessions gesamt</div></div>
    </div>
    <div class="section-title">Letzte 16 Wochen</div>
    <div class="heatmap">${heatHTML}</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px">← älter · neuer →</div>
    ${legendHTML}
  </div>`;
}
